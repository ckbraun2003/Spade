# The default library's sources (scene/library_sources.hpp, THE TEXT).
# Hand-written. Every number in a library entry cites one of these by id, with
# a grade. SOURCES.md beside this file is the same list for people, one
# "### `<id>`" heading per source; tests/test_library_sources.cpp keeps the
# two in step. A not_usable source stays listed so a citation of it is
# refused by name (ruling 4 of the library plan).
sources_version: 1
