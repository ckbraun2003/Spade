    category: "drones"
    parts_map:
      - {slot: frame, part: "default:part.frame.x500_kit_frame", placement: {pos: [0, 0, 0], quat: [0, 0, 0.707106781187, 0.707106781187]}}
      - {slot: motor_front_right, part: "default:part.motor.dj2216_kv880", parent: frame, install_point: motor_front_right}
      - {slot: motor_front_left, part: "default:part.motor.dj2216_kv880", parent: frame, install_point: motor_front_left}
      - {slot: motor_rear_left, part: "default:part.motor.dj2216_kv880", parent: frame, install_point: motor_rear_left}
      - {slot: motor_rear_right, part: "default:part.motor.dj2216_kv880", parent: frame, install_point: motor_rear_right}
      - {slot: fc, part: "default:part.payload.pixhawk_6c", parent: frame, install_point: fc_6c}
      - {slot: gnss, part: "default:part.payload.gps_m8n_m9n_v1", parent: frame, install_point: gnss_stand}
      - {slot: companion, part: "default:part.payload.raspberry_pi_5", parent: frame, install_point: companion_tray}
      - {slot: camera, part: "default:part.payload.camera_module_3", parent: frame, install_point: camera_front}
      - {slot: battery, part: "default:part.battery.tattu_4s_5200", parent: frame, install_point: battery_pad}
      - {slot: radio, part: "default:part.payload.sik_radio_v3", parent: frame, install_point: radio_plate}
      - {slot: esc, part: "default:part.payload.electronics_misc", parent: frame, install_point: esc_between_plates}
      - {slot: prop_front_right, part: "default:part.prop.x500_rotor_front_ccw", parent: motor_front_right, install_point: prop_hub}
      - {slot: prop_front_left, part: "default:part.prop.x500_rotor_front_cw", parent: motor_front_left, install_point: prop_hub}
      - {slot: prop_rear_left, part: "default:part.prop.x500_rotor_rear_ccw", parent: motor_rear_left, install_point: prop_hub}
      - {slot: prop_rear_right, part: "default:part.prop.x500_rotor_rear_cw", parent: motor_rear_right, install_point: prop_hub}
