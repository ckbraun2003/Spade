# =============================================================================
# Spade's default library -- the index of the root `default` (library version 3, index_version 1).
#
# WHAT THIS IS: the list of what the editor's Library panel offers and Kat's builder shows: drones (model files), objects (object files) and parts (part
# files: props, motors, ESCs and batteries). It is HAND-WRITTEN, never a folder walk, so the order below is the order the editor shows, and a test loads
# every entry (tests/test_library.cpp). The library contract (docs/design/core/plans/2026-11-17-spade-library-json-contract.md, section 2) is the
# format: each entry has an `id` (its kind first: model., object., part.<motor|prop|esc|battery>.), a `name` (non-empty, unique per kind ignoring case),
# a `category` (free text; the editor groups by it, in the order categories first appear here; Interface owns the categories), a `file` (relative to
# this folder, forward slashes, never absolute and no '..'; its extension agrees with its kind) and an optional `thumbnail` (an image relative to this
# folder; one that is named must exist). Unknown, missing and duplicate keys are errors.
#
# The ids are the ones the library set derived from this file's version-2 form (tests/data/library_default_v2.yaml, kept as the reader's fixture):
# kind prefix + the file's stem, lower-cased with anything outside [a-z0-9_] as '_'. tests/test_library_default_root.cpp pins id for id, file for file.
# scene::load_library() reads library.yaml here into the same Library (name, category, file, thumbnail, kind) the version-2 file gave, so the editor
# and every other reader of that call are unchanged.
#
# The part files are GENERATED (tests/test_library_parts.cpp, with SPADE_LIBRARY_WRITE set), as are the object files (tests/test_library.cpp, with
# SPADE_LIBRARY_WRITE set), and so is the drone (tests/test_library_quad.cpp): never edit those by hand. So are the thumbnails (thumbnails/*.png, 96 x 96,
# tests/test_library_thumbnails.cpp): an entry's owner adds its key and regenerates with SPADE_LIBRARY_WRITE=1 ctest -R LibraryThumbnails in the same
# commit. This index is edited by hand.
# =============================================================================

