scene_version: 1
name: "drop"

# The world this scene is placed in: a path relative to this file, and
# FNV-1a 64 of the world file's canonical text of that world. Another
# world is refused.
world:
  file: "../worlds/drop.world.yaml"
  hash: "0x2a25918895b37925"

# Appended after the world's material palette. A name the world already
# uses is refused.
materials: []

# Vehicle models, registered in this order. `design_to_principal` turns the
# design frame into the principal-axis body frame; `com_offset` is the
# centre of mass from the design origin, in the design frame. Rotor, drag
# and IMU mounts are in the body frame.
models:
  - name: "drop_body"
    version: 1
    param_schema_id: 0
    visual_ref: ""
    design_to_principal: [1, 0, 0, 0]
    com_offset: [0, 0, 0]
