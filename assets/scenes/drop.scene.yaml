    proxy_radius: 0
    rotors: []
    drag_bodies: []
    imu_mounts: []

# Static scenery, in scene order. `collider.sdf` is the world file's SDF
# encoding in the asset's frame, with node_materials by name; no nodes means
# no collision. An empty visual means none.
assets: []

# Vehicles, in scene order. A start is in its model's design frame.
