# =============================================================================
# Spade scene file -- schema version 1.
#
# WHAT THIS IS: a world reference plus the objects placed in it -- materials,
# vehicle models, static assets, and vehicles with their start states.
# spade::scene::compose() turns it into one runnable world.
#
# GENERATED by spade::scene::scene_to_yaml(). Hand editing is supported: every
# field is validated on load, and re-saving normalizes the file back to this
# canonical form (fixed key order, fixed float spelling, these comments).
#
# UNITS are SI -- metres, kilograms, seconds, radians -- in a right-handed,
# Y-up frame. FLOATS carry 9 significant digits, so every value survives a
# load and a save bit for bit. Quaternions are [w, x, y, z].
#
# NAMES, NEVER INDICES: a visual and a collider's nodes name their materials.
# Names are unique within materials, within models, and across assets and
# vehicles together.
# =============================================================================

scene_version: 1
name: "wind"

# The world this scene is placed in: a path relative to this file, and
# FNV-1a 64 of the world file's canonical text of that world. Another
# world is refused.
world:
  file: "../worlds/wind.world.yaml"
  hash: "0x329aed9831b4c72c"

# Appended after the world's material palette. A name the world already
# uses is refused.
materials: []

# Vehicle models, registered in this order. `design_to_principal` turns the
# design frame into the principal-axis body frame; `com_offset` is the
# centre of mass from the design origin, in the design frame. Rotor, drag
# and IMU mounts are in the body frame.
models:
  - name: "hover_quad"
    version: 1
    param_schema_id: 0
    visual_ref: "meshes/quadrotor_demo"
    design_to_principal: [1, 0, 0, 0]
    com_offset: [0, 0, 0]
    body: {mass: 1, inertia_diag: [0.0179999992, 0.0320000015, 0.0240000002]}
    proxy_radius: 0.200000003
    rotors:
      - {local_pos: [0.180000007, 0.0199999996, 0], local_orient: [1, 0, 0, 0], spin_dir: 1, tau: 0.0199999996, radius: 0.129999995, thrust_coeff: 1.20000004e-05, torque_coeff: 1.89999994e-07}
      - {local_pos: [0, 0.0199999996, 0.180000007], local_orient: [1, 0, 0, 0], spin_dir: -1, tau: 0.0199999996, radius: 0.129999995, thrust_coeff: 1.20000004e-05, torque_coeff: 1.89999994e-07}
      - {local_pos: [-0.180000007, 0.0199999996, 0], local_orient: [1, 0, 0, 0], spin_dir: 1, tau: 0.0199999996, radius: 0.129999995, thrust_coeff: 1.20000004e-05, torque_coeff: 1.89999994e-07}
      - {local_pos: [0, 0.0199999996, -0.180000007], local_orient: [1, 0, 0, 0], spin_dir: -1, tau: 0.0199999996, radius: 0.129999995, thrust_coeff: 1.20000004e-05, torque_coeff: 1.89999994e-07}
    drag_bodies:
      - {mode: "quadratic", area: 0.0500000007, coeffs: [1.60000002, 0, 0], local_pos: [0, 0, 0], local_orient: [1, 0, 0, 0]}
    imu_mounts:
      - {mount_pos: [0, 0, 0], mount_orient: [1, 0, 0, 0], rate_divider: 1, sigma_a: 0, sigma_g: 0, sigma_ba: 0, sigma_bg: 0}

# Static scenery, in scene order. `collider.sdf` is the world file's SDF
# encoding in the asset's frame, with node_materials by name; no nodes means
# no collision. An empty visual means none.
assets: []

# Vehicles, in scene order. A start is in its model's design frame.
vehicles:
  - name: "hover_quad_0"
    model: "hover_quad"
    start: {position: [0, 3, 0], orientation: [1, 0, 0, 0], velocity: [0, 0, 0], omega_body: [0, 0, 0], rotor_omega: 452.001343}

# Slots reserved for objects that appear at runtime, added to the world's
# capacities when the scene is composed.
spare: {bodies: 0, force_elements: 0, sensors: 0, contacts: 0}
