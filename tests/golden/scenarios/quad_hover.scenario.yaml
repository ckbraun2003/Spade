scenario_version: 1
name: "quad_hover"
world: "../worlds/quad_hover.world.yaml"

# Two instances of ONE world file, identical but for their rng roots -- which
# is what makes the world-isolation assertion meaningful.
instances:
  - seed: 0xC0FFEE0DAD
    contacts: {restitution_e: 0, friction_mu: 0, baumgarte_beta: 0.200000003, slop: 0.00100000005, proxy_radius: 0.150000006}
    grid: {cell_size: 0.5}
    turbulence: moderate
  - seed: 0xC0FFEE0DAE
    contacts: {restitution_e: 0, friction_mu: 0, baumgarte_beta: 0.200000003, slop: 0.00100000005, proxy_radius: 0.150000006}
    grid: {cell_size: 0.5}
    turbulence: moderate

step: {dt_ns: 2000000, substeps: 2, steps: 900}

# A 1 kg quadrotor with 12 cm props on 15 cm arms -- roughly a 5-inch racing
# frame, and deliberately a real set of numbers rather than round ones. The
# three principal moments are distinct (and Iy is the largest, as it is for a
# flat airframe), so an X/Z axis swap cannot pass unnoticed.
models:
  - quadrotor:
      name:            "quad_hover"
      param_schema_id: 1
      visual_ref:      "meshes/quad_hover"
      mass:            1
      inertia_diag:    [0.0120000001, 0.0209999997, 0.0160000008]
      arm_length:      0.150000006
      rotor_height:    0.0199999996
      proxy_radius:    0.150000006
      # k_T = 1e-5 N s^2 gives a hover shaft speed of sqrt(mg / 4 k_T);
      # k_Q = 1.6e-7 N m s^2 is a torque/thrust ratio of 16 mm, the right
      # order for a prop this size.
      rotors:
        - {tau: 0.0199999996, radius: 0.119999997, thrust_coeff: 9.99999975e-06, torque_coeff: 1.59999999e-07}
        - {tau: 0.0199999996, radius: 0.119999997, thrust_coeff: 9.99999975e-06, torque_coeff: 1.59999999e-07}
        - {tau: 0.0199999996, radius: 0.119999997, thrust_coeff: 9.99999975e-06, torque_coeff: 1.59999999e-07}
        - {tau: 0.0199999996, radius: 0.119999997, thrust_coeff: 9.99999975e-06, torque_coeff: 1.59999999e-07}
      # +-+-, in index order: diagonally opposite rotors co-rotate, so the
      # collective is yaw-neutral and the diagonal differential is not.
      spin_dirs:       [1, -1, 1, -1]
      drag:
        - {mode: quadratic, area: 0.0199999996, coeffs: [0.899999976, 0, 0], local_pos: [0, 0, 0], local_orient: [1, 0, 0, 0]}
      imu:
        {mount_pos: [0, 0, 0], mount_orient: [1, 0, 0, 0], rate_divider: 1,
         sigma_a: 0, sigma_g: 0, sigma_ba: 0, sigma_bg: 0}

# One vehicle per world, at 50 m, level, at rest, IN TRIM.
spawns:
  - world: 0
    vehicle:
      model:       0
      pos:         [0, 50, 0]
      orient:      [1, 0, 0, 0]
      vel:         [0, 0, 0]
      omega_body:  [0, 0, 0]
      rotor_omega: hover
  - world: 1
    vehicle:
      model:       0
      pos:         [0, 50, 0]
      orient:      [1, 0, 0, 0]
      vel:         [0, 0, 0]
      omega_body:  [0, 0, 0]
      rotor_omega: hover

# The collective script: hold trim, step up 10%, step down to 90% of trim.
# Both vehicles fly the same commands, so their trajectories differ only by
# the turbulence their own seeds draw.
inputs:
  - {tick:   0, rotor_commands: {vehicle: 0, omega: [495.14267, 495.14267, 495.14267, 495.14267]}}
  - {tick:   0, rotor_commands: {vehicle: 1, omega: [495.14267, 495.14267, 495.14267, 495.14267]}}
  - {tick: 300, rotor_commands: {vehicle: 0, omega: [544.656921, 544.656921, 544.656921, 544.656921]}}
  - {tick: 300, rotor_commands: {vehicle: 1, omega: [544.656921, 544.656921, 544.656921, 544.656921]}}
  - {tick: 600, rotor_commands: {vehicle: 0, omega: [445.628387, 445.628387, 445.628387, 445.628387]}}
  - {tick: 600, rotor_commands: {vehicle: 1, omega: [445.628387, 445.628387, 445.628387, 445.628387]}}

expected_digest: "0xe77ce28dc7797c22"
