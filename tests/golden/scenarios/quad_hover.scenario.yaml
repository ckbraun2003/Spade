# =============================================================================
# Spade scenario file -- schema version 1.
#
# WHAT THIS IS: one determinism-corpus scenario, complete -- the world file it
# instantiates, the per-world seeds and physics parameters, the step
# decomposition, every spawn, every scripted input, and the 64-bit digest of
# every registered state byte the run must end on.
#
# THE DIGEST IS THE GOLDEN. `expected_digest` is an FNV-1a 64 fold of the whole
# registry walk at the final tick, as defined by engine/testing/replay.hpp's
# state_digest(). It changes when -- and only when -- a pinned op order, an rng
# construction, a state layout, the pass schedule, the array registration order,
# or this scenario's own parameters change. Every one of those is a deliberate,
# reviewable act; NONE is a drive-by. Moving this number without recording why
# in this header defeats the point of committing it.
#
# UNITS are SI throughout -- metres, kilograms, seconds, radians, newtons -- in
# a right-handed, Y-up frame.
#
# FLOATS carry 9 significant digits. That is exactly what an IEEE-754 binary32
# needs to survive a decimal round trip without losing a bit, and this engine is
# fp32 end to end: fewer digits would silently change the run.
#
# EVERY KEY BELOW IS REQUIRED except `models` (and a body's `drag_elements`),
# and an UNKNOWN key is an ERROR at every level rather than a warning -- a
# reader of this version must never silently drop a field a later version
# added. `scenario_version` is the one upgrade path.
# =============================================================================
#
# -----------------------------------------------------------------------------
# SCENARIO: quad_hover -- the corpus's first VEHICLE scenario, and S5's fifth.
# Two worlds from one world file, one quadrotor in each, spawned in exact hover
# trim, flying a three-step collective script. 900 steps of 2 ms at 2 substeps
# (1.8 s of flight).
#
# WHAT IT COVERS THAT THE OTHER FOUR DO NOT
#
#   * THE WHOLE VEHICLE PATH. A registered ModelType, a composed spawn (one
#     body + four rotor rows + one drag body + one IMU mount from one
#     description), the RotorElement pass with its RPM lag, momentum-theory
#     inflow and SDF-sampled ground effect, and the IMU synthesis writing a
#     sample into its ring every substep. None of that is in the four migrated
#     scenarios, all of which are bare bodies.
#   * TWO-WORLD VEHICLE ISOLATION (ticket T18-M3). The two worlds differ only in
#     their rng roots, so a leak between them -- a rotor row addressed by global
#     rather than world-local slot, say -- shows up as world 0's per-world digest
#     depending on whether world 1 exists. The test asserts it does not.
#   * vehicle_ref_at() THROUGH A RESTORE (ticket T18-M2). The input script
#     re-derives its VehicleRef from the state at every command rather than
#     holding the one spawn() returned, so the run can be snapshotted mid-script
#     at tick 450, restored into a FRESH Simulation, and finished -- landing on
#     the uninterrupted run's digest. That is the test the new API exists for.
#
# THE WORLD HAS NO SDF GEOMETRY AT ALL, deliberately: an empty program evaluates
# to kSdfEmptyDistance, so the ground-effect factor is exactly 1 and
# hover_command()'s trim is exact rather than approximate. Contacts are
# configured and unreachable. The other four scenarios cover contact physics.
#
# `rotor_omega: hover` is vehicles::hover_command(params) -- the common shaft
# speed at which these four rotors produce exactly this airframe's weight. It is
# the model's own function of its own parameters, so retuning the airframe
# retunes the trim; the tick-0 command below is that same number written out,
# and the test asserts the two agree bit for bit.
#
# THE TWO WORLDS DO NOT FLY THE SAME TRAJECTORY, and that is the design rather
# than a surprise. Moderate turbulence at the default reference airspeed is a
# NEAR-CONSTANT GUST BIAS over an episode this short, not a buffet (tau_w = 10 s;
# see sim/world_set.hpp's note), so each world flies in essentially ONE draw of
# its own seed: world 0 drew a sink and ends BELOW its spawn altitude, world 1
# drew a mild updraft and ends above it, on identical commands. A hover trim is
# exact in still air, and this air is not still. That divergence is precisely
# what makes the pair a usable world-isolation test.
#
# PROVENANCE OF `expected_digest`
#   NEW at S5 Task 7 -- the only digest this task generates rather than carries.
#   Seeded by the runner that the same commit's bridging test proves equivalent
#   to the S1-S4 builder corpus, and CROSS-CHECKED on gcc-13 Linux CI before the
#   commit was final (draft PR, closed unmerged; the run id is in the task
#   report). msvc-ninja-release and msvc-ninja-debug agree.
#   generated  2026-08-12
#   toolchain  MSVC 19.44 (VS 2022 Community) x64, /fp:precise, Ninja
#
#   MOVED at S6 Task 2 (D-S6-2, "collision consumes per-body proxy_radius"):
#   0xf11be12c1c16b612 -> 0xe77ce28dc7797c22. This is the program's ONE
#   authorized CPU golden move. Root cause: D-S6-2 makes Simulation::spawn
#   (world, ModelTypeId, VehicleSpawn) write the model's own proxy_radius into
#   the spawned body's BodyState::proxy_radius (state/layout.hpp) -- a lane
#   that was UNUSED std430 padding, always 0, through S5. This scenario's
#   quadrotor model declares `proxy_radius: 0.150000006` (above), so its two
#   spawned bodies now carry that value in registered, snapshot-walked,
#   digest-hashed state where every prior run carried 0. THE VALUE HAPPENS TO
#   EQUAL this scenario's own `contacts.proxy_radius` (also 0.150000006,
#   both instances, above), so CollisionStatic/CollisionDynamic's ANSWERS are
#   unchanged bit-for-bit (this world has no SDF geometry at all and only one
#   body per world, so neither pass ever resolves a contact regardless of the
#   radius value read) -- the move is a pure BYTE-STATE change, not a physics
#   change: the digest hashes the whole registry walk, and a body's slot no
#   longer contains the same bytes it used to. The other four corpus scenarios
#   are entirely bare-body worlds (no vehicle spawn ever writes this lane), so
#   their digests are untouched -- exactly the "only worlds containing
#   vehicles can move" guarantee D-S6-2's sentinel design makes structural.
#   VERIFIED on msvc-ninja-release AND msvc-ninja-debug (both presets, full
#   suite green, both digests literally captured before and after the change
#   -- see the task-2 report). CROSS-CHECKED LOCALLY on 2026-08-17 on gcc-13
