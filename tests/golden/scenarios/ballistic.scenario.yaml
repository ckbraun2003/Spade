# =============================================================================
# Spade scenario file -- schema version 1.
#
# WHAT THIS IS: one determinism-corpus scenario, complete -- the world file it
# instantiates, the per-world seeds and physics parameters, the step
# decomposition, every spawn, every scripted input, and the 64-bit digest of
# every registered state byte the run must end on.
#
# THE DIGEST IS THE GOLDEN. `expected_digest` is an FNV-1a 64 fold of the whole
# registry walk at the final tick, as defined by engine/testing/replay.hpp's
# state_digest(). It changes when -- and only when -- a pinned op order, an rng
# construction, a state layout, the pass schedule, the array registration order,
# or this scenario's own parameters change. Every one of those is a deliberate,
# reviewable act; NONE is a drive-by. Moving this number without recording why
# in this header defeats the point of committing it.
#
# UNITS are SI throughout -- metres, kilograms, seconds, radians, newtons -- in
# a right-handed, Y-up frame.
#
# FLOATS carry 9 significant digits. That is exactly what an IEEE-754 binary32
# needs to survive a decimal round trip without losing a bit, and this engine is
# fp32 end to end: fewer digits would silently change the run.
#
# EVERY KEY BELOW IS REQUIRED except `models` (and a body's `drag_elements`),
# and an UNKNOWN key is an ERROR at every level rather than a warning -- a
# reader of this version must never silently drop a field a later version
# added. `scenario_version` is the one upgrade path.
# =============================================================================
#
# -----------------------------------------------------------------------------
# SCENARIO: ballistic -- one body in an empty world (no SDF geometry at all),
# under gravity, a quadratic drag element reading a moderate-turbulence Dryden
# medium, and a scripted per-tick wrench. 200 steps of 5 ms at 5 substeps (1 ms
# substep). The purest determinism case: no contact can clamp a divergence away,
# so the Dryden stream, the drag law and the integrator are all naked here.
#
# THE 200-ENTRY INPUT SCRIPT below is the tabulated form of what the S1-S4
# builder called scripted_force(tick, 0):
#
#     a = float((tick + i) % 7) - 3      force = (a * 0.05, 0, b * 0.05)
#     b = float((tick * 3 + i) % 5) - 2
#
# -- deliberately transcendental-free and deliberately independent of the WORLD
# index, so that a batching-invariance comparison cannot be confounded by the
# script. Written out rather than expressed, because a data format that carried
# a formula would be a language.
#
# PROVENANCE OF `expected_digest`
#   Value carried VERBATIM from tests/golden/ballistic.digest -- CONTAINER
#   CHANGE ONLY. S5 Task 7 retires the .digest files into this field; the number
#   below is byte-for-byte the one that file held, NOT a regeneration, and the
#   bridging test in tests/test_determinism.cpp
#   (GoldenCorpus.TheDataScenariosReproduceTheRetiredBuilderCorpus) is the
#   committed proof that the data scenario and the builder lambda it replaced
#   produce the same digest.
#
#   The narrative that file carried, preserved:
#
#   * REGENERATED 2026-08-11 -- the platform-libm parity fix (PR #5). Until then
#     these were not digests of THE ENGINE but of the engine PLUS whichever C
#     runtime's libm generated them: rng::Stream::next_gauss() built its
#     Box-Muller pair with std::log/cos/sin, for which IEEE mandates nothing, and
#     MSVC's CRT and glibc disagree by one ulp on roughly one argument in a
#     hundred. core/fp32_math.hpp's log32/sin32/cos32 -- built exclusively from
#     IEEE-mandated operations, exhaustively verified to <=1 ulp -- replaced them.
#     That moved every digest in the corpus (same quality, different bits), which
#     is the expected consequence of removing a platform dependency, not a
#     physics change. The resulting value is verified green on spade-windows
#     (MSVC 19.44) and spade-linux (gcc-13) in the same CI run: the property this
#     corpus was always meant to have and, until that commit, never had.
#       previous digest 0x9cc4be8c415e0d68 (Task 18, 2026-08-10) -- an MSVC value
#
#   * REGENERATED 2026-08-11 -- S5 Task 3: replay_config joins the walk (M-1).
#     state_digest() folds EVERY registered array, so registering a new one moves
#     every digest by construction. replay_config is registered LAST, so the new
#     digest is the OLD digest with its two trailing walk entries folded on top --
#     CHECKED, not assumed, by a temporary test that seeded the fold with each
#     scenario's previous value and folded only the suffix:
#       ballistic: old=0xc1ee6cfa86946e99 old+suffix=0x234f74d4c3c53563 actual=0x234f74d4c3c53563 match=YES
#     The "registered last" premise is pinned by ReplayConfig.OccupiesItsPinnedWalkPosition.
#       previous digest 0xc1ee6cfa86946e99 (S1-S4 close-out, 2026-08-11)
#
#   generated  2026-08-11 (Task 3 regeneration; first generated at Task 16)
#   toolchain  MSVC 19.44 (VS 2022 Community) x64, /fp:precise, Ninja
#   cross-check gcc-13 Release -ffp-contract=off (spade-linux CI) produces this
#              same value; msvc-ninja-release AND msvc-ninja-debug agree
# -----------------------------------------------------------------------------

scenario_version: 1
name: "ballistic"
world: "../worlds/ballistic.world.yaml"

# One world: no geometry, moderate turbulence, contacts configured but
# unreachable (nothing to hit).
instances:
  - seed: 0xB0117571C0FFEE
    contacts: {restitution_e: 0, friction_mu: 0, baumgarte_beta: 0.200000003, slop: 0.00100000005, proxy_radius: 0.100000001}
    grid: {cell_size: 0.5}
    turbulence: moderate

step: {dt_ns: 5000000, substeps: 5, steps: 200}

# One body, plus the quadratic drag element that makes it read the medium.
spawns:
  - world: 0
    body:
      pos:              [0, 100, 0]
      orient:           [1, 0, 0, 0]
      vel:              [3, 0, -2]
      omega_body:       [0.300000012, -0.100000001, 0.200000003]
      mass:             0.899999976
      inv_inertia_diag: [120, 90, 110]
      drag_elements:
        - {mode: quadratic, area: 0.0500000007, coeffs: [1.10000002, 0, 0], local_pos: [0, 0.0199999996, 0], local_orient: [1, 0, 0, 0]}

