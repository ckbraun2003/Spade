#   bounce: old=0x8b6bd5f0df9ff4fa new=0xf40bc68019136458
#   The walk gained four entries -- gnss_sensors, gnss_ring and each one's
#   .slot_to_world companion -- APPENDED AFTER replay_config, so this digest
#   is the previous one with that suffix folded on top. replay_config's own
#   walk index (16) did not move, which is what keeps every earlier
