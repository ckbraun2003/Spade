# =============================================================================
# Spade scenario file -- schema version 1.
#
# WHAT THIS IS: one determinism-corpus scenario, complete -- the world file it
# instantiates, the per-world seeds and physics parameters, the step
# decomposition, every spawn, every scripted input, and the 64-bit digest of
# every registered state byte the run must end on.
#
# THE DIGEST IS THE GOLDEN. `expected_digest` is an FNV-1a 64 fold of the whole
# registry walk at the final tick, as defined by engine/testing/replay.hpp's
# state_digest(). It changes when -- and only when -- a pinned op order, an rng
# construction, a state layout, the pass schedule, the array registration order,
# or this scenario's own parameters change. Every one of those is a deliberate,
# reviewable act; NONE is a drive-by. Moving this number without recording why
# in this header defeats the point of committing it.
#
# UNITS are SI throughout -- metres, kilograms, seconds, radians, newtons -- in
# a right-handed, Y-up frame.
#
# FLOATS carry 9 significant digits. That is exactly what an IEEE-754 binary32
# needs to survive a decimal round trip without losing a bit, and this engine is
# fp32 end to end: fewer digits would silently change the run.
#
# EVERY KEY BELOW IS REQUIRED except `models` (and a body's `drag_elements`),
# and an UNKNOWN key is an ERROR at every level rather than a warning -- a
# reader of this version must never silently drop a field a later version
# added. `scenario_version` is the one upgrade path.
# =============================================================================
#
# -----------------------------------------------------------------------------
# SCENARIO: shower -- 100 spheres dropped into an SDF bowl (a solid sphere of
# radius 4 minus a sphere of radius 3.8 centred 0.4 m higher, so the shell is
# thick at the bottom and open-ish at the top). 400 steps of 2 ms at 2 substeps.
#
# CollisionStatic and CollisionDynamic both run hot and a pile forms. This is
# the scenario that would expose an ordering dependence in the sorted-grid
# sweep: a hundred bodies in mutual contact resolve Gauss-Seidel, so any
# instability in the sort order or the neighbour walk changes the pile.
#
# THE 100 SPAWN POSITIONS are the tabulated form of the S1-S4 builder's lattice:
#     pos = (-1.2 + 0.3 * (i % 5), 0.35 * (i / 25), -1.2 + 0.3 * ((i / 5) % 5))
# evaluated in fp32, which is why they are written to 9 digits rather than as
# the round decimals the expression suggests.
#
# PROVENANCE OF `expected_digest`
#   Value carried VERBATIM from tests/golden/shower.digest -- CONTAINER CHANGE
#   ONLY (S5 Task 7 retires the .digest files into this field). Not a
#   regeneration; the bridging test in tests/test_determinism.cpp is the
#   committed proof that this data scenario and the builder lambda it replaced
#   produce the same digest.
#
#   * REGENERATED 2026-08-11 -- the platform-libm parity fix (PR #5). Every
#     digest in the corpus moved: next_gauss()'s Box-Muller pair now uses
#     core/fp32_math.hpp's IEEE-only log32/sin32/cos32 instead of libm, so every
#     gaussian changes in its last bit or two. Same quality (<=1 ulp,
#     exhaustively verified over all 2^24 arguments), different bits -- the
#     expected consequence of removing a platform dependency, not a physics
#     change.
#
#   * REGENERATED 2026-08-11 -- S5 Task 3: replay_config joins the walk (M-1).
#     Suffix continuation, checked rather than assumed:
#       shower: old=0x6b773b313e06dd38 old+suffix=0xbc94f5b048b45473 actual=0xbc94f5b048b45473 match=YES
#       previous digest 0x6b773b313e06dd38 (S1-S4 close-out, 2026-08-11)
#
#   * REGENERATED 2026-10-05 -- PHY-7: the IMU's specific force includes the
#     contact response. The contact passes add each body's velocity change to a
#     transient scratch, and Integrate adds it over h to `specific_force`, which
#     the walk digests. Nothing else changed: vel, pos and every other array take
#     the same values, and contact-free scenarios (ballistic, gnss_tumble,
#     quad_hover) keep their digests, -0.0 included.
#       previous digest 0x6bdc2e623501dd47 (S5 Task 3, 2026-08-11)
#
#   generated  2026-10-05 (PHY-7 regeneration; first generated at Task 16)
#   toolchain  MSVC 19.44 (VS 2022 Community) x64, /fp:precise, Ninja
#   cross-check msvc-ninja-release AND msvc-ninja-debug agree; the gcc-13 Docker
#              leg (TD-12) reproduces it on a fresh -NoSeed volume
#              (spade-docker-leg-83d33ae26902, PASS 1168/1168)
# -----------------------------------------------------------------------------

scenario_version: 1
name: "shower"
world: "../worlds/shower.world.yaml"

instances:
