# Static scenery, in scene order. `collider.sdf` is the world file's SDF
# encoding in the asset's frame, with node_materials by name; no nodes means
# no collision. An empty visual means none.
assets: []

# Vehicles, in scene order. A start is in its model's design frame.
vehicles:
  - name: "pod_1"
    model: "pod"
    start: {position: [0, 0.5, 0], orientation: [1, 0, 0, 0], velocity: [0, 0, 0], omega_body: [0, 0, 0], rotor_omega: 0}

# Slots reserved for objects that appear at runtime, added to the world's
# capacities when the scene is composed.
spare: {bodies: 0, force_elements: 0, sensors: 0, contacts: 0}
