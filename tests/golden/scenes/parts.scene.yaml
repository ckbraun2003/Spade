scene_version: 2
name: "parts"

# The world this scene is placed in: a path relative to this file, and
# FNV-1a 64 of the world file's canonical text of that world. Another
# world is refused.
world:
  file: "../worlds/gate.world.yaml"
  hash: "0xcba01d9a3a73064c"

# Appended after the world's material palette. A name the world already
# uses is refused.
materials: []

# Vehicle models, registered in this order. `design_to_principal` turns the
# design frame into the principal-axis body frame; `com_offset` is the
# centre of mass from the design origin, in the design frame. Rotor, drag
# and IMU mounts are in the body frame.
# Parts (scene version 2): a part's mount is in the body frame, or, on a
# rotor, in that rotor's hub frame at azimuth 0. Its shape is the world
# file's SDF encoding, in the part's own frame.
models:
  - name: "pod"
    version: 1
    param_schema_id: 0
    visual_ref: ""
    design_to_principal: [1, 0, 0, 0]
    com_offset: [0, 0, 0]
    body: {mass: 0.5, inertia_diag: [0.001953125, 0.00390625, 0.001953125]}
    proxy_radius: 0.125
    rotors:
      - {local_pos: [0.0625, 0, 0.0625], local_orient: [1, 0, 0, 0], spin_dir: 1, tau: 0.03125, radius: 0.0625, thrust_coeff: 4.09999984e-06, torque_coeff: 6.1999998e-08}
