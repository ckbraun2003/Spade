        attach: "body"
        rotor: 0
        mount: {position: [0, 0.015625, 0], orientation: [1, 0, 0, 0]}
        surface: {kind: "porous", inv_permeability: 1000000, inertial_coeff: 20}
        min_feature: 0.03125
        shape:
          sdf:
            transforms:
