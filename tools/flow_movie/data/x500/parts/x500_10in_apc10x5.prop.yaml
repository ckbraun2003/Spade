  blade.c_over_r: {source: "uiuc_propdb", grade: derived, note: "UIUC geometry at 9.4 in [the X500: used at UIUC's own 10 in, the kit's 1045 size; the library's part applies it at 9.4 in (NASA's rotor)]"}
