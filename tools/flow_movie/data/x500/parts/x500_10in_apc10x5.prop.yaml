  diameter: {source: "uiuc_propdb", grade: derived, note: "derived: UIUC's APC Thin Electric 10x5 is a 10 in propeller; the X500 V2 kit's propeller is the 1045, 10 in (Holybro's kit page; KAT's x500.airframe.json evidence), so R is 0.127 m"}
