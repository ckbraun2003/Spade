  blade.cd_scale: {source: "uiuc_propdb", grade: fitted, note: "fitted through the actuator line WITH THE TIP CORRECTION ON to UIUC's static C_T and C_Q (docs/design/physics/plans/2026-11-17-b1-polar-fits.md); valid only at the kernel width and resolution fitted and with the tip correction on: 12 mm kernel (2.93 cells), R/dx 31, 5000 rpm, D 10 in; line C_T 0.09619 vs UIUC 0.09636, C_Q 0.005886 vs 0.005870 [the X500: used at UIUC's own 10 in, the kit's 1045 size; the library's part applies it at 9.4 in (NASA's rotor)]"}
