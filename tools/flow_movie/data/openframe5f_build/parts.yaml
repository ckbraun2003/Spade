      # the M3 F-F 20 mm standoffs: the exported one at (-10.25, 69.5) mm, and its copies at (+10.25, 69.5), (-12.75, 24.0) and (+12.75, 24.0), by translation in the maker's frame (metres)
      - {store_ref: {sha256: 2d2737a3f0ab6d89817358c49f98c5621a69281740b3b07fb9a30d92b21d8787, file: "Standoff M3 F-F 20 OD5.spmesh"}, material: aluminium_anodised}
