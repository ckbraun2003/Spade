  - name: openframe_frame
    kind: frame
    mass_kg: 0.170
    mass_grade: published
    mass_source: "OpenFrame-5F README, \"Weight | 170 g measured: carbon, aluminium and hardware, without the TPU parts\"; the product page https://opendrone.be/products/openframe says \"170 g, without TPU parts (est.)\". The two pages disagree on measured against estimated, so it is the maker's published figure and not graded measured here"
    pose_grade: derived
    # the maker's part-studio frame turned to the design frame (see the header); the plates, the cross, the four arms (two hands), the four M3 standoffs and the two aluminium side plates
    pose: {position: [0, 0.003, 0], orientation: [0.5, -0.5, 0.5, 0.5]}
    material: carbon
    objects:
      - {store_ref: {sha256: ba14a6eee949b89b0f42ede8e0b80100a14c4feeef6313b4353f7aa83cbcd58e, file: Base-Bot.spmesh}}
