# The X500 build for the website clips: where each part sits on the frame. Written by hand from measurements; the library entries (L88l) will be pinned equal to this table by a test.
#
# FRAME. One frame for every position: the PX4 x500 body mesh as the part store holds it (x500-body.gltf, drawing-only). Y up, +X forward, +Z right (starboard), origin = the vehicle's
# centre of mass, metres, orientation quaternions [w, x, y, z]. The library's design frame is Z up, +X forward, +Y left; an entry converts a table point (X, Y, Z) to (X, -Z, Y).
# Rotors: the vehicle's rotor order and spins are Physics' x500 model (tools/flow_movie/data/x500/x500.model.yaml): rotor 0 front-right (spin 1), 1 front-left (-1), 2 rear-left (1),
# 3 rear-right (-1); spin 1 is the clockwise file, so the file names follow KAT's rotor_visuals. Each rotor mesh is modelled at its own origin, hub on its y axis, so the pose is the hub.
#
# HOW IT WAS MEASURED. Surfaces read off x500-body.gltf (horizontal faces and component boxes), the parts' own bounding boxes read from the stored .spmesh files (the part frame),
# the pose chosen so the part's box sits on the named surface. pose_grade: measured = placed on a surface read from the frame mesh, assumed = a layout choice the frame leaves open.
#   top plate 148 x 148 x 2 mm, y 0.023..0.025;  damper deck 66 x 66 mm, y 0.0328..0.0343 on four rubber dampers (kept: the 6C sits on them);  front plate 67.5 x 81 mm, x 0.0918..0.1593,
#   y -0.0004;  battery tray 100 x 40 x 1 mm, y -0.0466..-0.0456 under the lower plate;  built-in Pixhawk-4-class block (material drone/x500-body/autopilot) hidden when the 6C is drawn.
# MASSES. mass_grade is the library's: measured, published, retailer, derived, assumed. The sum is 1.64 kg; it is nobody's take-off weight, and it is not tuned to KAT's Gazebo 2.0643 kg.

hide_materials: [drone/x500-body/autopilot]

