# The X500 build for the website clips: where each part sits on the Holybro X500 V2 kit. Written by hand from measurements; the library entries (L88l) will be pinned equal to this table by a test.
#
# FRAME. One frame for every position (the design frame): the kit's own CAD file as the part store holds it (x500v2-frame.step, store entry d2a28d276fe74896, 65 objects) turned 180 degrees about its
# vertical axis. Y up, +X forward, +Z right (starboard), metres, orientation quaternions [w, x, y, z]; the origin is the kit file's origin: the frame's centre on the bottom plate's lower face (y 0), NOT the centre
# of mass. The centre of mass is the one value a drawing shifts by (below). The kit file is millimetres with forward at its -X (the depth-camera bracket and the optical-flow cover are at -X, the GPS stand at +X)
# and the stored meshes are metres in the file's axes, so every kit object takes the pose [0, 0, 0] with orientation [0, 0, 1, 0] and (x, y, z)_table = (-x, y, -z)_file. The library's design frame is Z up, +X forward,
# +Y left; an entry converts a table point (X, Y, Z) to (X, -Z, Y).
# Forward is the file's -X, graded derived (L88s): the kit's docs say nothing about front or rear.
# Rotors: the vehicle's rotor order and spins are Physics' x500 model (tools/flow_movie/data/x500/x500.model.yaml): rotor 0 front-right (spin 1), 1 front-left (-1), 2 rear-left (1), 3 rear-right (-1).
# spin +1 is the engine's spin_dir: counter-clockwise seen from above (vehicles/rotor.hpp, consumers.md L7a), so a +1 rotor takes the *-ccw file, whose blades lift turning counter-clockwise (Rendering measured the
# blade pitch), and a -1 rotor the *-cw file. Each rotor glTF is modelled at its own origin, hub on its y axis, so the pose is the hub; its 59 mm bell is hidden (the rotor entry's own hide_materials) because the kit's 28.7 mm motor is drawn.
# The kit's motor axes are at +-0.1774 m on each axis (501.8 mm motor to motor on the diagonal). The hub height is the can top (y 0.052) plus the 0.011 m by which the rotor glTF's origin stands over its own bell's
# top (the glTF pair Rendering authored: the prop's hub spans -0.016 to +0.0094 about the origin, the bell tops out at -0.011), 0.063 m; the kit file shows no prop adaptor, and the shaft top is 0.0641. The hub height is graded assumed (the rotor file's own hub-to-bell relation, not a measurement of the kit).
#
# HOW IT WAS MEASURED. Every kit object is read from the part store (record docs/design/interface/records/2026-11-18-x500-parts-sources.md): the 61 frame objects and the 4 motors, each at its own place in the
# file. The other parts' own bounding boxes are read from their stored .spmesh files (the part frame), and each pose puts the part's box on a surface read from the kit file. pose_grade: measured = placed on a surface read
# from the kit (the heading of a part whose case does not say which end is the front is assumed), derived = from the kit file's positions plus a stated rule, assumed = a layout choice the kit leaves open.
#   top plate 143.7 x 143.7 x 2 mm, top face y 0.032;  battery tray 100 x 50.3 x 2 mm at y -0.0455 with a 2 mm pad under it (underside y -0.0485);  payload platform 65 x 93 x 2 mm, top face y -0.026, whose centre
#   is the GPS stand's 29.7 mm base;  GPS stand tray top y 0.107 at x -0.099 (the rear), on a 108 mm rod;  the pylons stand at x +-0.035 on the tray, the rail tubes at z +-0.030, y -0.013.
# MASSES. mass_grade is the library's: measured, published, retailer, derived, assumed. The sum is 1.633 kg: it is nobody's take-off weight, and it is not tuned to KAT's Gazebo 2.0643 kg. The mast of the old table is gone
# (the kit's own GPS stand is in the frame, whose 0.610 kg is the bare kit); the motors and the propellers are two entries each (0.055 + 0.013 kg, the old 0.068 kg rotor entry split).
# CENTRE OF MASS in this frame: [-0.00448, -0.02581, 0.00056] m (the mass-weighted centre of the entries' boxes and, for the frame, the volume-weighted centre of its 61 objects, equal density: derived). A drawing shifts by it.

parts:
  - name: x500_frame
    kind: frame
    mass_kg: 0.610
    mass_grade: published
    mass_source: Holybro X500 V2 kit page https://holybro.com/products/px4-development-kit-x500-v2 (the bare frame kit, no motors, ESCs or electronics)
    pose_grade: derived
    # the kit file as stored, turned to the design frame; the plates, arm tubes, motor mounts, arm clamps, motor base plates, landing gear, the GPS stand, and the battery tray with the payload platform and rails
    # (materials are assumed from the parts' names and the kit's look: the file carries one steel colour for all)
    pose: {position: [0, 0, 0], orientation: [0, 0, 1, 0]}
    material: carbon
